      /* Nothing on the page is selected by a long press: no highlighted text, magnifier or
         Safari's copy bar under quick actions or a drag, wherever the finger lands. The whole
         document, not only #root: menus, dialogs and cards (react-native-web's Modal) are drawn in
         their own node in body. Text fields keep their own selection. */
      html,
      body,
      body * {
        -webkit-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      /* Chat messages (data-selectable) are text to copy, as fields are. */
      input,
      textarea,
      [contenteditable='true'],
      [data-selectable],
      [data-selectable] * {
        -webkit-user-select: text !important;
        user-select: text !important;
        -webkit-touch-callout: default !important;
      }
    </style>
    <script>
      // A long press in Safari can start a selection before any style applies (from the icon on
      // the Home Screen too): no selection starts outside a text field or a chat message.
      document.addEventListener('selectstart', function (e) {
        var t = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
        if (!t || !t.closest('input, textarea, [contenteditable="true"], [data-selectable]'))
          e.preventDefault();
      });
    </script>
